name: BM25 filter migration

on:
  push:
    paths:
      - 'migrations/versioned/*bm25_filter_fields*'
      - 'scripts/test_bm25_filter_fields.py'
      - 'internal/application/repository/retriever/postgres/**'
      - '.github/workflows/bm25-filter-migration.yml'
  pull_request:
    paths:
      - 'migrations/versioned/*bm25_filter_fields*'
      - 'scripts/test_bm25_filter_fields.py'
      - 'internal/application/repository/retriever/postgres/**'
      - '.github/workflows/bm25-filter-migration.yml'

permissions:
  contents: read

jobs:
  paradedb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          go test ./internal/application/repository/retriever/postgres -count=1
          go test ./internal/database -run '^TestMigrationDirectoriesLoad$' -count=1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/test_bm25_filter_fields.py --output-dir /tmp/bm25-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bm25-filter-evidence
          path: /tmp/bm25-evidence
